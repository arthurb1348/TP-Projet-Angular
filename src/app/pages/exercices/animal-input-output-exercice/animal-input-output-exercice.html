<section class="mx-auto max-w-5xl p-4">
    <h2 class="mb-4 text-2xl font-bold">Animaux du refuge</h2>

    <div class="mb-4 flex flex-wrap gap-2">
        <span class="badge badge-success">
            Disponibles {{ availableCount() }}
        </span>
        <span class="badge badge-neutral">
            Adoptés {{ adoptedCount() }}
        </span>
    </div>

    <div role="status">
        @if (actionMessage(); as message) {
            <div class="alert alert-info mb-4">
                <span>{{ message }}</span>
            </div>
        }
    </div>

    <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        @for (animal of animals(); track animal.id) {
        <app-animal-card 
            [name]="animal.name"
            [species]="animal.species"
            [age]="animal.age"
            [energy]="animal.energy"
            [adoption]="animal.adoption"
            (adoptionToggled)="toggleAdoption(animal.id)"
            (energyChanged)="changeEnergy(animal.id, $event)"
        ></app-animal-card>
        }
        <app-animal-card name="Pistache" species="Lapin"></app-animal-card>
    </div>
</section>
