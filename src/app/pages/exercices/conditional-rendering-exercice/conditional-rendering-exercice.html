<section class="p-4">
    <h1 class="text-2xl font-bold mb-4">Exercice de rendu conditionnel</h1>

    <label for="friend-name">Nom de l’ami</label>
    <input
        id="friend-name"
        type="text"
        placeholder="Tapez le nom de votre ami..."
        class="input input-bordered w-full max-w-md"
        (input)="onUpdateFriendsList($event)"
    >

    <p class="text-lg font-semibold">Nom saisi : {{ listFriendsInputText }}</p>
    @if (listFriendsAuth) {
        <p class="text-green-500 font-bold">🥳🥳🥳Votre ami a été ajouté !</p>
    } @else {
        <p class="text-red-500 font-bold">Aucun ami ...</p>
    }

    <button
        type="button"
        class="btn btn-primary"
        (click)="onAddingFriends()"
    >
        Ajouter cet ami
    </button>
    <ng-template #failTemplate>
        <p>🥶 🥶 🥶 Aucun ami ...</p>
    </ng-template>
</section>
