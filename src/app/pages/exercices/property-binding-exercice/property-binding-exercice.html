<div class="flex items-center justify-between mb-4">
    <h1 class="text-2xl font-bold">Exercice de Property Binding</h1>
</div>

<div class="friend-card p-4 rounded-lg shadow-md bg-white">
    <img class="friend-photo" [src]="oneFriend.imgUrl" [alt]="oneFriend.name">

    <h2 class="text-xl font-semibold">{{ oneFriend.name }}</h2>

    <p class="text-gray-600">Âge : {{ oneFriend.age }} ans</p>
    <p class="text-gray-600">{{ oneFriend.bio }}</p>
    <p class="text-gray-600">Statut : {{ getOneFriendStatus() }}</p>
    <p class="text-gray-600">Réputation : {{ oneFriend.status === 'online' ? 'Cool' : 'Ringard' }}</p>
</div>
